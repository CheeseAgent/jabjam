name: Render follow-along MP4
on:
  workflow_dispatch:
    inputs:
      course:
        description: Repository-relative course JSON
        required: true
        default: courses/neon-round.json
        type: string
      song_title:
        description: 歌名（留空读取课程或音频标题）
        type: string
      difficulty:
        description: 难度（course 沿用课程设置）
        type: choice
        options: [course, easy, normal]
        default: course
      min_gap:
        description: 最短拳间隔（秒，留空使用课程设置）
        type: string
  pull_request:
    paths:
      - 'video/**'
      - 'courses/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.github/workflows/render-video.yml'
  push:
    branches: [main]
    paths:
      - 'video/**'
      - 'courses/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.github/workflows/render-video.yml'
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COURSE: ${{ inputs.course || 'courses/neon-round.json' }}
      SONG_TITLE: ${{ inputs.song_title }}
      DIFFICULTY: ${{ inputs.difficulty || 'course' }}
      MIN_GAP: ${{ inputs.min_gap }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the offline renderer
        run: docker build --platform linux/amd64 --target video-export -t jabjam-video .
      - name: Render and verify the selected course, four punches and a three-minute course
        shell: bash
        run: |
          set -eu
          mkdir -p build/video
          limits=(--rm --network none --cpus 2 --memory 300000000 --memory-swap 300000000)
          mount=(--user "$(id -u):$(id -g)" -v "$PWD/build/video:/out")
          docker run "${limits[@]}" jabjam-video python3 tests/test_video_pacing.py
          options=()
          if [[ -n "$SONG_TITLE" ]]; then options+=(--song-title "$SONG_TITLE"); fi
          if [[ "$DIFFICULTY" != course ]]; then options+=(--difficulty "$DIFFICULTY"); fi
          if [[ -n "$MIN_GAP" ]]; then options+=(--min-gap "$MIN_GAP"); fi
          docker run "${limits[@]}" "${mount[@]}" jabjam-video \
            python3 tests/render_video_job.py "$COURSE" /out/jabjam.mp4 "${options[@]}"
          docker run "${limits[@]}" "${mount[@]}" jabjam-video \
            python3 tests/render_video_job.py courses/four-punches.json /out/four-punches.mp4 --check-cues --song-title "Pulse" --difficulty easy --min-gap 1.4
          docker run "${limits[@]}" "${mount[@]}" jabjam-video sh -eu -c '
            ffmpeg -v error -stream_loop -1 -i tests/fixtures/pulse.ogg -t 180 \
              -ac 1 -ar 16000 -c:a pcm_s16le /tmp/three-minutes.wav
            python3 -c "import json; c=json.load(open(\"courses/neon-round.json\")); c[\"course\"][\"music\"]=\"three-minutes.wav\"; print(json.dumps(c))" > /tmp/three-minutes.json
            python3 tests/render_video_job.py /tmp/three-minutes.json /tmp/three-minutes.mp4
            cp /tmp/three-minutes.resources.json /out/
          '
      - uses: actions/upload-artifact@v4
        with:
          name: jabjam-follow-along-${{ github.run_id }}
          path: build/video/
          if-no-files-found: error
          retention-days: 1
